name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: JSON 문법
        run: |
          for f in .claude-plugin/*.json hooks/*.json; do
            jq empty "$f" && echo "ok $f"
          done
      - name: 매니페스트 버전 일치
        run: |
          v="$(jq -r .version .claude-plugin/plugin.json)"
          grep -q "## $v" CHANGELOG.md || { echo "CHANGELOG.md 에 $v 항목이 없다"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: eval 채점기 문법
        run: node --check templates/eval/score.mjs

  hook-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: 훅·스크립트 시나리오 테스트
        run: |
          # macOS: 사용자 기본값인 /bin/bash(3.2)로 돌린다. 러너의 Homebrew bash 5 로 돌면 3.2 전용 버그를 못 잡는다.
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p "$RUNNER_TEMP/bash32"
            ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
            export PATH="$RUNNER_TEMP/bash32:$PATH"
          fi
          bash --version | head -1
          for t in tests/*.test.sh; do
            echo "== $t"
            bash "$t" || exit 1
          done
