# harness-init — Stop 훅 설정 (.claude/harness.conf)
# 이 파일이 있어야 플러그인의 Stop 훅이 동작한다. 지우거나 ENABLED=0 이면 꺼진다.

# 타입 + 린트 + 테스트를 한 번에 도는 명령 (1단계). 1~2분 안에 끝나야 한다.
CHECK_CMD="npm run check"

# 감시할 경로 (git pathspec, 공백 구분). 여기가 바뀐 턴에만 검사한다. 비우면 저장소 전체.
WATCH_PATHS="src/ tests/"

# 검사 시간 제한(초). 넘기면 실패로 보고 "느린 검사를 빼라"고 알린다. 0 = 제한 없음.
TIMEOUT_SEC=180

# 고치고 다시 끝내려다 연속으로 실패해도 되는 횟수. 넘으면 루프를 멈추고 사람에게 알린다.
MAX_RETRIES=3

# 1 = 기존 테스트 파일만 수정되고 기능 코드는 그대로면 한 번 경고 (테스트를 고쳐 통과시키기 방지)
TEST_GUARD=1
# 테스트 파일로 볼 경로 (확장 정규식). 기본값으로 충분하면 주석 그대로 둔다.
# TEST_PATTERN='(^|/)(tests?|__tests__|specs?)/|\.(test|spec)\.[^/]+$|_test\.[^/]+$|(^|/)test_[^/]+\.py$'

# 규칙 문서 폴더 (/harness-init:spec · sync 가 쓴다)
SPECS_DIR="docs/specs"

# 1 = 규칙 문서가 바뀌었는데 반영(sync) 안 됐으면, 다음 대화에서 Claude 가 "sync 할까요?"를 제안
SPEC_REMINDER=1

# make 의 확인 강도: auto | fast | full
#   auto = 작은 수정(바뀐 규칙 5개 이하, 위험한 영역 아님)은 빠르게, 새 기능·큰 변경·위험한 영역은 꼼꼼하게
#   fast = 망가뜨려 보기는 위험한 규칙만, 독립 검사 생략 (비용·시간 약 절반)
#   full = 규칙마다 망가뜨려 보기 + 독립 검사
# 한 번만 바꾸려면 말로: "빠르게 만들어줘" / "꼼꼼하게 확인해줘"
MODE=auto

# 실패 시 Claude에게 보여줄 출력 줄 수
TAIL_LINES=30

# 1 = 켜짐, 0 = 잠시 끄기
ENABLED=1
