schema_version: "1.1"
name: smoke-make-trigger
description: 하네스가 켜진 프로젝트에서 "계산기.md 보고 만들어줘" → harness-make 스킬 발동, 자유 글이면 규칙 정리부터
tags: [smoke]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  disallowed_tools: [AskUserQuestion]
  append_system_prompt: |
    이 평가 환경에서는 파일을 쓰거나 명령을 실행할 수 없다 (읽기만 가능).
    하네스 절차를 따르되, 실행 대신 "무엇을 어떤 순서로 할지"를 구체적으로 말하고 끝내라.
    사용자에게 물어야 할 것이 있으면 그 질문을 그대로 적어라.
  prompt: 계산기.md 보고 계산기 만들어줘
